<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <!-- Brand gradient square -->
  <rect width="64" height="64" rx="14" fill="url(#mrBg)"/>
  <!--
       Stylized "M" mark, drawn as a path so the favicon renders
       identically across browsers without relying on a system font.
       The two diagonal strokes meet at the centre with a small
       valley — the visual rhythm of a chip's M(icro).
  -->
  <path
    d="M 14 48 L 14 18 L 22 18 L 32 32 L 42 18 L 50 18 L 50 48 L 44 48 L 44 28 L 34 41 L 30 41 L 20 28 L 20 48 Z"
    fill="#FFFFFF"
  />
  <!-- Small accent dot — "real-time pulse" cue -->
  <circle cx="51" cy="14" r="3.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
