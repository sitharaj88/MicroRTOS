name: Docs site

# Manual deploy only — trigger from the Actions tab when you're ready
# to publish the docs site. No automatic runs on push or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two manual runs land back-to-back, only the latest one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache the Next.js build between runs. The hash of source files is
      # part of the key so a code change invalidates the cache cleanly.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: docs-site/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('docs-site/pnpm-lock.yaml') }}-${{ hashFiles('docs-site/**/*.{ts,tsx,js,jsx,mdx,css}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('docs-site/pnpm-lock.yaml') }}-

      - name: Build static site
        env:
          # GitHub Pages project URL: https://sitharaj88.github.io/MicroRTOS/
          # The basePath must match the repo name exactly.
          NEXT_PUBLIC_BASE_PATH: /MicroRTOS
          NEXT_PUBLIC_SITE_URL: https://sitharaj88.github.io/MicroRTOS
        run: pnpm build

      # GitHub Pages requires .nojekyll so it doesn't strip _next/ paths.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
