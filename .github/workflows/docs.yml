name: Docs site

# Manual trigger only — run this workflow from the Actions tab when you
# want to publish a new version of the docs to GitHub Pages. Avoids
# noisy deploys on every push and keeps publishing intentional.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        env:
          # GitHub Pages project URL: https://sitharaj88.github.io/MicroRTOS/
          # The basePath must match the repo name exactly.
          NEXT_PUBLIC_BASE_PATH: /MicroRTOS
          NEXT_PUBLIC_SITE_URL: https://sitharaj88.github.io/MicroRTOS
        run: pnpm build

      # GitHub Pages requires .nojekyll so it doesn't strip _next/ paths.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
